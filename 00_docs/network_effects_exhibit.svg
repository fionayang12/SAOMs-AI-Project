<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="950" viewBox="0 0 1310 950" font-family="Helvetica"><rect width="1310" height="950" fill="#FFFFFF"/><text x="24" y="40" font-size="26" font-weight="bold" fill="#1B2A36">Network Effects in the v8 SAOM Specification</text><text x="24" y="64" font-size="14.5" fill="#4A5A66">Each panel shows the collaboration tie under consideration (dashed) from the focal inventor <tspan font-style="italic">i</tspan>. All ties are undirected co-inventing relations.</text><circle cx="34" cy="88" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="54" y="92" font-size="13" fill="#41505B">incumbent</text><circle cx="154" cy="88" r="13" fill="#E8833A" stroke="#3A3A3A" stroke-width="1.4"/><text x="174" y="92" font-size="13" fill="#41505B">newcomer</text><line x1="269" y1="88" x2="319" y2="88" stroke="#8A8A8A" stroke-width="1.8"/><text x="329" y="92" font-size="13" fill="#41505B">existing tie</text><line x1="429" y1="88" x2="479" y2="88" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><text x="489" y="92" font-size="13" fill="#41505B">tie being modeled</text><line x1="624" y1="88" x2="674" y2="88" stroke="#C9C9C9" stroke-width="1.4" stroke-dasharray="2,3"/><text x="684" y="92" font-size="13" fill="#41505B">prior career ties (covariate)</text><g transform="translate(20,118)"><rect x="0" y="0" width="410" height="252" rx="10" fill="#FBFBF9" stroke="#D8D8D2" stroke-width="1.2"/><text x="16" y="28" font-size="16.5" font-weight="bold" fill="#20323F" font-family="Helvetica">1. Density (outdegree)</text><line x1="120" y1="125" x2="290" y2="125" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><circle cx="120" cy="125" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="2.6"/><text x="120" y="129.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">i</text><circle cx="290" cy="125" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="290" y="129.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">j</text><text x="16" y="222" font-size="12.8" fill="#41505B" font-family="Helvetica">Baseline tendency to form any tie: the &#8220;cost&#8221; of collaboration.</text><text x="16" y="239" font-size="12.8" fill="#41505B" font-family="Helvetica">Anchors the model; nearly always strongly negative.</text></g><g transform="translate(440,118)"><rect x="0" y="0" width="410" height="252" rx="10" fill="#FBFBF9" stroke="#D8D8D2" stroke-width="1.2"/><text x="16" y="28" font-size="16.5" font-weight="bold" fill="#20323F" font-family="Helvetica">2. Transitive ties (transTies)</text><line x1="140" y1="175" x2="205" y2="75" stroke="#8A8A8A" stroke-width="1.8"/><line x1="205" y1="75" x2="270" y2="175" stroke="#8A8A8A" stroke-width="1.8"/><line x1="140" y1="175" x2="270" y2="175" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><circle cx="205" cy="75" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="205" y="79.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">h</text><circle cx="140" cy="175" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="2.6"/><text x="140" y="179.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">i</text><circle cx="270" cy="175" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="270" y="179.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">j</text><text x="16" y="222" font-size="12.8" fill="#41505B" font-family="Helvetica">Closure: a shared partner h pulls the i&#8211;j tie shut.</text><text x="16" y="239" font-size="12.8" fill="#41505B" font-family="Helvetica">Collaborators of my collaborators become mine.</text></g><g transform="translate(860,118)"><rect x="0" y="0" width="410" height="252" rx="10" fill="#FBFBF9" stroke="#D8D8D2" stroke-width="1.2"/><text x="16" y="28" font-size="16.5" font-weight="bold" fill="#20323F" font-family="Helvetica">3. Degree activity + popularity (degPlus)</text><line x1="275" y1="120" x2="296.20524888619144" y2="61.739057511273685" stroke="#8A8A8A" stroke-width="1.8"/><circle cx="296.20524888619144" cy="61.739057511273685" r="8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><line x1="275" y1="120" x2="333.2609424887263" y2="98.79475111380854" stroke="#8A8A8A" stroke-width="1.8"/><circle cx="333.2609424887263" cy="98.79475111380854" r="8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><line x1="275" y1="120" x2="328.6935750346352" y2="151.0" stroke="#8A8A8A" stroke-width="1.8"/><circle cx="328.6935750346352" cy="151.0" r="8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><line x1="275" y1="120" x2="285.7661870153497" y2="181.0580806867569" stroke="#8A8A8A" stroke-width="1.8"/><circle cx="285.7661870153497" cy="181.0580806867569" r="8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><line x1="275" y1="120" x2="235.14716819943456" y2="167.49475547337664" stroke="#8A8A8A" stroke-width="1.8"/><circle cx="235.14716819943456" cy="167.49475547337664" r="8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><line x1="115" y1="120" x2="275" y2="120" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><circle cx="275" cy="120" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="275" y="124.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">j</text><circle cx="115" cy="120" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="2.6"/><text x="115" y="124.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">i</text><text x="16" y="222" font-size="12.8" fill="#41505B" font-family="Helvetica">Preferential attachment: ties gravitate toward inventors</text><text x="16" y="239" font-size="12.8" fill="#41505B" font-family="Helvetica">who are already well connected in this network.</text></g><g transform="translate(20,380)"><rect x="0" y="0" width="410" height="252" rx="10" fill="#FBFBF9" stroke="#D8D8D2" stroke-width="1.2"/><text x="16" y="28" font-size="16.5" font-weight="bold" fill="#20323F" font-family="Helvetica">4. Newcomer ego (egoX)</text><line x1="140" y1="120" x2="265" y2="80" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><line x1="140" y1="120" x2="265" y2="165" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><circle cx="140" cy="120" r="13" fill="#E8833A" stroke="#3A3A3A" stroke-width="2.6"/><text x="140" y="124.5" font-size="13" font-style="italic" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica">i</text><circle cx="265" cy="80" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="265" y="84.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">j</text><circle cx="265" cy="165" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="265" y="169.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">k</text><text x="16" y="222" font-size="12.8" fill="#41505B" font-family="Helvetica">Do newcomers form more (or fewer) ties overall</text><text x="16" y="239" font-size="12.8" fill="#41505B" font-family="Helvetica">than incumbent inventors?</text></g><g transform="translate(440,380)"><rect x="0" y="0" width="410" height="252" rx="10" fill="#FBFBF9" stroke="#D8D8D2" stroke-width="1.2"/><text x="16" y="28" font-size="16.5" font-weight="bold" fill="#20323F" font-family="Helvetica">5. Career tenure ego (egoX)</text><line x1="140" y1="125" x2="290" y2="125" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><circle cx="140" cy="125" r="20" fill="none" stroke="#B7C6D2" stroke-width="1.6"/><circle cx="140" cy="125" r="27" fill="none" stroke="#D5DFE7" stroke-width="1.4"/><circle cx="140" cy="125" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="2.6"/><text x="140" y="129.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">i</text><circle cx="290" cy="125" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="290" y="129.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">j</text><text x="140" y="176" font-size="11.5" text-anchor="middle" fill="#6A7B88" font-family="Helvetica">years of experience</text><text x="16" y="222" font-size="12.8" fill="#41505B" font-family="Helvetica">Does experience change tie formation? (Unstable when</text><text x="16" y="239" font-size="12.8" fill="#41505B" font-family="Helvetica">tenure barely varies; the Case C parameter.)</text></g><g transform="translate(860,380)"><rect x="0" y="0" width="410" height="252" rx="10" fill="#FBFBF9" stroke="#D8D8D2" stroke-width="1.2"/><text x="16" y="28" font-size="16.5" font-weight="bold" fill="#20323F" font-family="Helvetica">6. Network constraint ego (egoX)</text><line x1="105" y1="90" x2="105" y2="165" stroke="#8A8A8A" stroke-width="1.8"/><line x1="105" y1="90" x2="170" y2="127" stroke="#8A8A8A" stroke-width="1.8"/><line x1="105" y1="165" x2="170" y2="127" stroke="#8A8A8A" stroke-width="1.8"/><line x1="170" y1="127" x2="300" y2="127" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><circle cx="105" cy="90" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="105" y="94.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">a</text><circle cx="105" cy="165" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="105" y="169.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">b</text><circle cx="170" cy="127" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="2.6"/><text x="170" y="131.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">i</text><circle cx="300" cy="127" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="300" y="131.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">j</text><text x="112" y="200" font-size="11.5" fill="#6A7B88" font-family="Helvetica">closed cluster (high constraint)</text><text x="16" y="222" font-size="12.8" fill="#41505B" font-family="Helvetica">Does embeddedness in a closed cluster (Burt&#8217;s constraint)</text><text x="16" y="239" font-size="12.8" fill="#41505B" font-family="Helvetica">dampen reaching out to new partners?</text></g><g transform="translate(20,642)"><rect x="0" y="0" width="410" height="252" rx="10" fill="#FBFBF9" stroke="#D8D8D2" stroke-width="1.2"/><text x="16" y="28" font-size="16.5" font-weight="bold" fill="#20323F" font-family="Helvetica">7. Inventor degree ego (egoX)</text><line x1="130" y1="125" x2="70" y2="75" stroke="#C9C9C9" stroke-width="1.4" stroke-dasharray="2,3"/><circle cx="70" cy="75" r="8" fill="#EFEFEF" stroke="#B9B9B9" stroke-width="1.4"/><line x1="130" y1="125" x2="60" y2="125" stroke="#C9C9C9" stroke-width="1.4" stroke-dasharray="2,3"/><circle cx="60" cy="125" r="8" fill="#EFEFEF" stroke="#B9B9B9" stroke-width="1.4"/><line x1="130" y1="125" x2="70" y2="175" stroke="#C9C9C9" stroke-width="1.4" stroke-dasharray="2,3"/><circle cx="70" cy="175" r="8" fill="#EFEFEF" stroke="#B9B9B9" stroke-width="1.4"/><line x1="130" y1="125" x2="295" y2="125" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><circle cx="130" cy="125" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="2.6"/><text x="130" y="129.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">i</text><circle cx="295" cy="125" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="295" y="129.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">j</text><text x="63" y="205" font-size="11.5" fill="#9A9A9A" font-family="Helvetica">career collaborations (covariate)</text><text x="16" y="222" font-size="12.8" fill="#41505B" font-family="Helvetica">Does prior collaboration breadth across the career</text><text x="16" y="239" font-size="12.8" fill="#41505B" font-family="Helvetica">(not this network) drive new tie formation?</text></g><g transform="translate(440,642)"><rect x="0" y="0" width="410" height="252" rx="10" fill="#FFF3EA" stroke="#E8833A" stroke-width="2"/><text x="16" y="28" font-size="16.5" font-weight="bold" fill="#20323F" font-family="Helvetica">8. Newcomer &#215; transitive ties</text><text x="394" y="28" font-size="11.5" text-anchor="end" fill="#C05A17" font-family="Helvetica" font-style="italic">theory-bearing, new in v8</text><line x1="140" y1="175" x2="205" y2="75" stroke="#8A8A8A" stroke-width="1.8"/><line x1="205" y1="75" x2="270" y2="175" stroke="#8A8A8A" stroke-width="1.8"/><line x1="140" y1="175" x2="270" y2="175" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><circle cx="205" cy="75" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="205" y="79.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">h</text><circle cx="140" cy="175" r="13" fill="#E8833A" stroke="#3A3A3A" stroke-width="2.6"/><text x="140" y="179.5" font-size="13" font-style="italic" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica">i</text><circle cx="270" cy="175" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="270" y="179.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">j</text><text x="16" y="222" font-size="12.8" fill="#41505B" font-family="Helvetica">Do newcomers close triads at different rates than</text><text x="16" y="239" font-size="12.8" fill="#41505B" font-family="Helvetica">incumbents?</text></g><g transform="translate(860,642)"><rect x="0" y="0" width="410" height="252" rx="10" fill="#FFF3EA" stroke="#E8833A" stroke-width="2"/><text x="16" y="28" font-size="16.5" font-weight="bold" fill="#20323F" font-family="Helvetica">9. Newcomer &#215; degPlus</text><text x="394" y="28" font-size="11.5" text-anchor="end" fill="#C05A17" font-family="Helvetica" font-style="italic">theory-bearing, new in v8</text><line x1="275" y1="120" x2="296.20524888619144" y2="61.739057511273685" stroke="#8A8A8A" stroke-width="1.8"/><circle cx="296.20524888619144" cy="61.739057511273685" r="8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><line x1="275" y1="120" x2="333.2609424887263" y2="98.79475111380854" stroke="#8A8A8A" stroke-width="1.8"/><circle cx="333.2609424887263" cy="98.79475111380854" r="8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><line x1="275" y1="120" x2="328.6935750346352" y2="151.0" stroke="#8A8A8A" stroke-width="1.8"/><circle cx="328.6935750346352" cy="151.0" r="8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><line x1="275" y1="120" x2="285.7661870153497" y2="181.0580806867569" stroke="#8A8A8A" stroke-width="1.8"/><circle cx="285.7661870153497" cy="181.0580806867569" r="8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><line x1="275" y1="120" x2="235.14716819943456" y2="167.49475547337664" stroke="#8A8A8A" stroke-width="1.8"/><circle cx="235.14716819943456" cy="167.49475547337664" r="8" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><line x1="115" y1="120" x2="275" y2="120" stroke="#2C7A4B" stroke-width="2.4" stroke-dasharray="6,5"/><circle cx="275" cy="120" r="13" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.4"/><text x="275" y="124.5" font-size="13" font-style="italic" text-anchor="middle" fill="#333333" font-family="Helvetica">j</text><circle cx="115" cy="120" r="13" fill="#E8833A" stroke="#3A3A3A" stroke-width="2.6"/><text x="115" y="124.5" font-size="13" font-style="italic" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica">i</text><text x="16" y="222" font-size="12.8" fill="#41505B" font-family="Helvetica">Do newcomers attach to hubs differently than incumbents?</text><text x="16" y="239" font-size="12.8" fill="#41505B" font-family="Helvetica"></text></g><text x="24" y="936" font-size="12" fill="#7A868F">v8 specification; RSiena effect names in parentheses. The rate function is estimated per network but not shown. Panels 8&#8211;9 interact the newcomer indicator with the structural effects in panels 2&#8211;3.</text></svg>